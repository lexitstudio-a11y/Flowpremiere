<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Keyframe Ease</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>Keyframe Ease</h1>

  <section>
    <div class="row">
      <div style="flex:2">
        <label for="paramSelect">Propriété à easer</label>
        <select id="paramSelect"></select>
      </div>
      <div style="flex:0 0 auto; align-self:flex-end;">
        <div class="btn small" id="refreshBtn" title="Relire le clip sélectionné">&#8635;</div>
      </div>
    </div>
    <div id="clipInfo" style="margin-top:6px; font-size:11px; color:var(--text-dim);">
      Aucun clip sélectionné.
    </div>
  </section>

  <section>
    <label>Courbe (temps &#8594; valeur)</label>
    <canvas id="curveCanvas" width="480" height="300"></canvas>

    <div class="row" style="margin-top:6px;">
      <div>
        <label for="curveType">Type</label>
        <select id="curveType">
          <option value="bezier">Bezier (x1,y1,x2,y2)</option>
          <option value="bounceOut">Bounce</option>
          <option value="elasticOut">Elastic</option>
          <option value="backOut">Back (out)</option>
          <option value="backInOut">Back (in-out)</option>
        </select>
      </div>
    </div>

    <div class="numFields" id="bezierFields">
      <div><label>x1</label><input type="number" id="x1" step="0.01" min="0" max="1" /></div>
      <div><label>y1</label><input type="number" id="y1" step="0.01" /></div>
      <div><label>x2</label><input type="number" id="x2" step="0.01" min="0" max="1" /></div>
      <div><label>y2</label><input type="number" id="y2" step="0.01" /></div>
    </div>

    <div class="numFields" id="amountFields" style="grid-template-columns: 1fr; display:none;">
      <div><label>Intensit&eacute;</label><input type="number" id="amount" step="0.05" /></div>
    </div>
  </section>

  <section>
    <label>Presets</label>
    <div id="presetGrid"></div>
    <div class="row" id="saveForm">
      <input type="text" id="presetName" placeholder="Nom du preset" />
      <div class="btn small" id="saveConfirmBtn">OK</div>
      <div class="btn small" id="saveCancelBtn">Annuler</div>
    </div>
  </section>

  <section>
    <div class="btn primary" id="applyBtn">Appliquer entre les keyframes autour du playhead</div>
    <div id="status" style="margin-top:6px;"></div>
  </section>

  <script src="js/easing.js"></script>
  <script src="js/premiere.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
